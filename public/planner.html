<div class="content jj-workspace" id="jjPlannerPage">
<section class="page-head playful-head"><div><span class="eyebrow">Your real itinerary</span><h1>Trip Planner</h1><p class="page-subtitle">Plan each day of your trip and arrange activities in your preferred order.</p></div><button class="btn primary" id="jjAddActivity" type="button"><i class="ph-bold ph-plus"></i> Add Activity</button></section>
<div class="jj-trip-control card"><label for="jjPlannerTrip">Select Trip</label><select id="jjPlannerTrip" aria-label="Select trip"></select><span id="jjPlannerSummary" class="jj-workspace-summary"></span></div>
<section id="jjPlannerBody" class="card jj-workspace-body"><p>Loading trip activities…</p></section>
</div>
</main>
<div class="modal" id="jjActivityModal" role="dialog" aria-modal="true" aria-labelledby="jjActivityModalTitle"><div class="card jj-editor"><div class="jj-editor-header"><h2 id="jjActivityModalTitle">Add Activity</h2><button type="button" aria-label="Close" class="jj-close" data-jj-close="jjActivityModal">✕</button></div>
<form id="jjActivityForm" class="jj-edit-form"><label>Activity name <input name="title" required maxlength="150" placeholder="Visit the night market"></label><div class="jj-two-fields"><label>Day <select name="day" id="jjActivityDay" required></select></label><label>Time <input type="time" name="time" value="09:00" required></label></div><label>Location <input name="location" maxlength="200" placeholder="Where will this take place?"></label><label>Details <textarea name="details" maxlength="2000" rows="3" placeholder="Notes, meeting point, transport…"></textarea></label><div class="jj-form-buttons"><button type="button" class="btn soft" data-jj-close="jjActivityModal">Cancel</button><button class="btn primary" type="submit" id="jjActivitySave">Save Activity</button></div></form></div></div>
<div class="toast" id="toast">
   Done
  </div>
