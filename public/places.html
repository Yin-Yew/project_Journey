<div class="content jj-workspace" id="jjPlacesPage">
<section class="page-head playful-head"><div><span class="eyebrow">Places for this Trip</span><h1>Places We Love</h1><p class="page-subtitle">Save attractions, restaurants and cafes for each trip. Vote on your next destination from Next Trip Vote.</p></div><button class="btn primary" id="jjAddPlace" type="button"><i class="ph-bold ph-plus"></i> Add Place</button></section>
<div class="jj-trip-control card"><label for="jjPlacesTrip">Select Trip</label><select id="jjPlacesTrip" aria-label="Select trip"></select><span id="jjPlacesSummary" class="jj-workspace-summary"></span></div>
<section id="jjPlacesBody" class="jj-workspace-body"><p>Loading places…</p></section>
</div>
</main>
<div class="modal" id="jjPlaceModal" role="dialog" aria-modal="true" aria-labelledby="jjPlaceModalTitle"><div class="card jj-editor"><div class="jj-editor-header"><h2 id="jjPlaceModalTitle">Add Place</h2><button type="button" aria-label="Close" class="jj-close" data-jj-close="jjPlaceModal">✕</button></div>
<form id="jjPlaceForm" class="jj-edit-form"><label>Place name <input name="name" required maxlength="150" placeholder="Coffee shop or attraction"></label><label>Type <select name="category" required><option value="attraction">Attraction</option><option value="restaurant">Restaurant</option><option value="cafe">Cafe</option></select></label><label>Image (JPEG, PNG, WebP up to 1.5 MB) <input name="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Or image URL (HTTPS) <input name="imageUrl" type="url" maxlength="1500" placeholder="https://example.com/photo.jpg"></label><img id="jjPlacePreview" alt="Place image preview" class="jj-place-preview" hidden><label>Description <textarea name="details" maxlength="2000" rows="3" placeholder="Why should we visit?"></textarea></label><div class="jj-form-buttons"><button type="button" class="btn soft" data-jj-close="jjPlaceModal">Cancel</button><button class="btn primary" type="submit" id="jjPlaceSave">Save Place</button></div></form></div></div>
<div class="toast" id="toast">
   Done
  </div>
