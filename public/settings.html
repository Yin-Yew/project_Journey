<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Settings · JoyJourney
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1">
  </script>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div aria-hidden="true" class="ambient">
   <i class="ph-fill ph-cloud">
   </i>
   <i class="ph-fill ph-star-four">
   </i>
   <i class="ph-fill ph-cloud">
   </i>
   <i class="ph-fill ph-sparkle">
   </i>
  </div>
  <aside class="sidebar">
   <a class="brand" href="index.html">
    <span class="brand-mark">
     <i class="ph-fill ph-airplane-tilt">
     </i>
    </span>
    <span>
     JoyJourney
    </span>
   </a>
   <nav>
    <a class="nav-link" href="index.html">
     <i class="ph-duotone ph-house">
     </i>
     <span>
      Dashboard
     </span>
    </a>
    <a class="nav-link" href="trips.html">
     <i class="ph-duotone ph-suitcase-rolling">
     </i>
     <span>
      My Trips
     </span>
    </a>
    <a class="nav-link" href="planner.html">
     <i class="ph-duotone ph-calendar-dots">
     </i>
     <span>
      Planner
     </span>
    </a>
    <a class="nav-link" href="places.html">
     <i class="ph-duotone ph-map-pin">
     </i>
     <span>
      Places
     </span>
    </a>
    <a class="nav-link" href="expenses.html">
     <i class="ph-duotone ph-wallet">
     </i>
     <span>
      Expenses
     </span>
    </a>
    <a class="nav-link" href="checklist.html">
     <i class="ph-duotone ph-check-square">
     </i>
     <span>
      Checklist
     </span>
    </a>
    <a class="nav-link" href="memories.html">
     <i class="ph-duotone ph-images">
     </i>
     <span>
      Memories
     </span>
    </a>
    <a class="nav-link active" href="settings.html">
     <i class="ph-duotone ph-gear-six">
     </i>
     <span>
      Settings
     </span>
    </a>
   </nav>
  </aside>
  <main class="main">
   <header class="topbar">
    <button aria-label="Open menu" class="menu-btn" onclick="toggleSidebar()">
     <i class="ph ph-list">
     </i>
    </button>
    <div class="search">
     <i class="ph ph-magnifying-glass">
     </i>
     <input placeholder="Search your journey..."/>
    </div>
    <div class="top-actions">
     <button aria-label="Notifications" class="icon-btn">
      <i class="ph-duotone ph-bell">
      </i>
      <span class="notification-dot">
      </span>
     </button>
     <a class="user-chip" href="profile.html">
      <img alt="Yin avatar" class="top-avatar" src="https://api.dicebear.com/9.x/notionists/svg?seed=Yin&amp;backgroundColor=ffd5dc"/>
      <span>
       <strong>
        Yin
       </strong>
       <small>
        Beach Explorer
       </small>
      </span>
      <i class="ph ph-caret-down">
      </i>
     </a>
    </div>
   </header>
   <div class="content">
    <section class="page-head">
     <div>
      <span class="eyebrow">
       Make it yours
      </span>
      <h1>
       Settings
      </h1>
      <p>
       Your theme and animation choices stay saved on this device.
      </p>
     </div>
    </section>
    <section class="grid settings-grid">
     <article class="card">
      <h3>
       Theme
      </h3>
      <div class="theme-picker">
       <button class="theme-choice" data-theme-choice="sakura" onclick="saveTheme('sakura')" type="button">
        <span class="theme-swatch" aria-hidden="true"><i style="--swatch:#ff9db6"></i><i style="--swatch:#ffe6a7"></i><i style="--swatch:#bfe7f7"></i></span>
        <span><strong>Sakura Picnic</strong><small>Blush · Butter · Sky</small></span>
        <i class="ph-fill ph-check-circle theme-check"></i>
       </button>
       <button class="theme-choice" data-theme-choice="ocean" onclick="saveTheme('ocean')" type="button">
        <span class="theme-swatch" aria-hidden="true"><i style="--swatch:#83d7f4"></i><i style="--swatch:#ffb5a7"></i><i style="--swatch:#d9c7ff"></i></span>
        <span><strong>Ocean Candy</strong><small>Blue · Coral · Lilac</small></span>
        <i class="ph-fill ph-check-circle theme-check"></i>
       </button>
       <button class="theme-choice" data-theme-choice="matcha" onclick="saveTheme('matcha')" type="button">
        <span class="theme-swatch" aria-hidden="true"><i style="--swatch:#a9d7b2"></i><i style="--swatch:#ffe6a3"></i><i style="--swatch:#ffc9b8"></i></span>
        <span><strong>Matcha Cream</strong><small>Sage · Butter · Peach</small></span>
        <i class="ph-fill ph-check-circle theme-check"></i>
       </button>
       <button class="theme-choice" data-theme-choice="lavender" onclick="saveTheme('lavender')" type="button">
        <span class="theme-swatch" aria-hidden="true"><i style="--swatch:#cdb6ff"></i><i style="--swatch:#ffbfd1"></i><i style="--swatch:#b8d9ff"></i></span>
        <span><strong>Lavender Milk</strong><small>Lilac · Pink · Periwinkle</small></span>
        <i class="ph-fill ph-check-circle theme-check"></i>
       </button>
       <button class="theme-choice" data-theme-choice="peach" onclick="saveTheme('peach')" type="button">
        <span class="theme-swatch" aria-hidden="true"><i style="--swatch:#ffb88c"></i><i style="--swatch:#ffe59b"></i><i style="--swatch:#9fe0da"></i></span>
        <span><strong>Peach Soda</strong><small>Peach · Lemon · Aqua</small></span>
        <i class="ph-fill ph-check-circle theme-check"></i>
       </button>
       <button class="theme-choice" data-theme-choice="berry" onclick="saveTheme('berry')" type="button">
        <span class="theme-swatch" aria-hidden="true"><i style="--swatch:#e99ac2"></i><i style="--swatch:#c9b5ff"></i><i style="--swatch:#ffd9bb"></i></span>
        <span><strong>Berry Yogurt</strong><small>Berry · Grape · Cream</small></span>
        <i class="ph-fill ph-check-circle theme-check"></i>
       </button>
      </div>
     </article>
     <article class="card">
      <h3>
       Animations
      </h3>
      <label class="switch-row">
       Cute animations
       <input checked="" id="animationToggle" onchange="saveAnimationSetting(this.checked)" type="checkbox"/>
      </label>
      <label class="switch-row">
       Sparkles
       <input checked="" id="sparkleToggle" onchange="saveSparkleSetting(this.checked)" type="checkbox"/>
      </label>
     </article>
     <article class="card">
      <h3>
       Account
      </h3>
      <a class="text-link" href="profile.html">
       <i class="ph-duotone ph-user-circle">
       </i>
       Edit Profile
      </a>
      <button class="settings-logout" onclick="authLogout()">
       <i class="ph-duotone ph-sign-out">
       </i>
       Logout
      </button>
     </article>
    </section>
   </div>
  </main>
  <div class="toast" id="toast">
   Done
  </div>
  <script src="js/api.js"></script>
  <script src="js/script.js">
  </script>
  <script src="js/auth.js">
  </script>
 </body>
</html>
